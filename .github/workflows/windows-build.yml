# Continuous Windows build (artifacts only).
# Full dual-platform Release upload is handled by release-assets.yml
# (Linux AppImage + Windows exe together).
name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps & build
        shell: pwsh
        working-directory: windows
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pyinstaller --noconfirm --clean SoundOrbitWin.spec
          Copy-Item -Force dist\SoundOrbit.exe dist\SoundOrbit-Windows-x64.exe
          Get-Item dist\SoundOrbit-Windows-x64.exe | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundOrbit-Windows-x64
          path: |
            windows/dist/SoundOrbit.exe
            windows/dist/SoundOrbit-Windows-x64.exe
          if-no-files-found: error
